<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Knowledge Constellation Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r169/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.169.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #e2e8f0; overflow: hidden; }

    .glass {
      background: rgba(18, 18, 26, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-light {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #canvas-container { width: 100vw; height: 100vh; position: relative; }

    /* Metrics Dashboard */
    .metrics-panel {
      position: absolute; top: 16px; left: 16px; right: 16px;
      border-radius: 16px; padding: 16px; z-index: 20;
    }
    .metrics-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 12px; }
    .metric-card { border-radius: 12px; padding: 12px; transition: background 0.2s; }
    .metric-card:hover { background: rgba(255,255,255,0.05); }
    .metric-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .metric-value { font-size: 1.125rem; font-weight: 700; color: white; margin-top: 4px; }
    .metric-label { font-size: 0.75rem; color: #94a3b8; font-weight: 500; }
    .metric-sub { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

    /* Search */
    .search-panel {
      position: absolute; top: 100px; left: 16px; width: 320px;
      border-radius: 12px; overflow: hidden; z-index: 30;
    }
    .search-input {
      width: 100%; background: transparent; border: none; outline: none;
      color: white; font-size: 0.875rem; padding: 12px 16px;
    }
    .search-input::placeholder { color: #64748b; }
    .search-results { max-height: 260px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.05); }
    .search-result {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      cursor: pointer; transition: background 0.15s; text-align: left; width: 100%; border: none;
      background: transparent; color: inherit;
    }
    .search-result:hover { background: rgba(255,255,255,0.05); }
    .result-avatar { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; }
    .result-label { font-size: 0.875rem; font-weight: 500; color: white; }
    .result-cat { font-size: 0.75rem; color: #64748b; }
    .result-cluster { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; }

    /* Node Info Panel */
    .info-panel {
      position: absolute; top: 100px; right: 16px; width: 380px;
      border-radius: 16px; max-height: calc(100vh - 120px); overflow-y: auto;
      z-index: 30; animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .info-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-section { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-title { font-size: 1.25rem; font-weight: 700; color: white; }
    .info-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; border: 1px solid; }
    .info-stat { text-align: center; padding: 8px; border-radius: 8px; }
    .info-stat-value { font-size: 1.125rem; font-weight: 700; color: white; }
    .info-stat-label { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
    .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.75rem; color: #cbd5e1; margin: 4px; }
    .neighbor-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 6px; }
    .resource-link { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.03); text-decoration: none; color: #cbd5e1; font-size: 0.875rem; margin-bottom: 6px; transition: background 0.15s; }
    .resource-link:hover { background: rgba(255,255,255,0.08); color: white; }
    .paper-card { padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 8px; }
    .paper-title { font-size: 0.875rem; font-weight: 500; color: white; }
    .paper-meta { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

    /* Legend */
    .legend-panel {
      position: absolute; bottom: 16px; left: 16px;
      border-radius: 12px; padding: 16px; z-index: 20;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-name { font-size: 0.75rem; color: #cbd5e1; }
    .legend-count { font-size: 0.75rem; color: #64748b; margin-left: auto; }

    /* Footer */
    .footer-panel {
      position: absolute; bottom: 16px; right: 16px;
      border-radius: 12px; padding: 12px; z-index: 20;
      display: flex; align-items: center; gap: 12px;
    }
    .social-link { color: #64748b; transition: color 0.15s; }
    .social-link:hover { color: white; }

    /* Tooltip */
    .tooltip {
      position: absolute; pointer-events: none; z-index: 50;
      padding: 8px 12px; border-radius: 8px; font-size: 0.875rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    /* Loading */
    .loading-screen {
      position: fixed; inset: 0; background: #0a0a0f;
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #94a3b8; font-size: 0.875rem; margin-top: 16px; }

    .instructions {
      position: absolute; bottom: 60px; left: 16px; z-index: 10;
      border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; color: #64748b;
    }
    .instructions span { color: #94a3b8; }
  </style>
</head>
<body>

    <div style="text-align:center">
      <div class="spinner"></div>
      <div class="loading-text">Loading constellation...</div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- Metrics Dashboard -->
  <div class="metrics-panel glass">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px">
      <h2 style="font-size:1.125rem; font-weight:600; color:white;">AI Knowledge Constellation</h2>
      <div style="display:flex; align-items:center; gap:8px; font-size:0.75rem; color:#94a3b8">
        <span style="width:8px; height:8px; border-radius:50%; background:#34d399; animation:pulse 2s infinite"></span>

  <!-- Search -->

      </button>
      <svg id="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
    </div>
    <div class="search-results" id="search-results" style="display:none"></div>
  </div>

  <!-- Node Info Panel -->
  <div class="info-panel glass" id="info-panel" style="display:none"></div>

  <!-- Legend -->
  <div class="legend-panel glass" id="legend-panel"></div>

  <!-- Footer -->
  <div class="footer-panel glass">
    <span style="font-size:0.75rem; color:#64748b">Share:</span>

    <a href="#" class="social-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>

  </div>

  <div class="instructions glass">Drag to rotate &bull; Scroll to zoom &bull; Click node for details</div>

  <div class="tooltip glass" id="tooltip" style="display:none"></div>

  <script>

    const CLUSTER_COLORS = {
      1: '#3b82f6', 2: '#8b5cf6', 3: '#10b981', 4: '#f59e0b', 5: '#ef4444', 6: '#06b6d4'

      { id: "llm", label: "LLM", category: "Core Concept", cluster: 5, description: "Large Language Models - neural networks trained on vast text corpora for understanding and generating human language.", related_concepts: ["transformers", "rag", "agents", "fine-tuning", "prompt-engineering"], external_resources: [{ title: "LLM Roadmap", url: "https://github.com/mlabonne/llm-course" }], related_papers: [{ title: "Attention Is All You Need", authors: "Vaswani et al.", year: 2017 }], connections: 8, x: 0, y: 0, z: 0 },
      { id: "rag", label: "RAG", category: "Architecture", cluster: 1, description: "Retrieval-Augmented Generation combines external knowledge retrieval with LLM generation to reduce hallucinations and provide up-to-date answers.", related_concepts: ["embeddings", "vector-databases", "faiss", "qdrant", "chroma", "llm", "graphrag"], external_resources: [{ title: "RAG Survey Paper", url: "https://arxiv.org/abs/2312.10997" }, { title: "LangChain RAG Docs", url: "https://python.langchain.com/docs/tutorials/rag/" }], related_papers: [{ title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", authors: "Lewis et al.", year: 2020 }], connections: 6, x: -12, y: 8, z: 5 },
      { id: "agents", label: "Agents", category: "Architecture", cluster: 2, description: "AI systems that can perceive their environment, make decisions, and take actions autonomously using tools and reasoning.", related_concepts: ["langgraph", "crewai", "autogen", "mcp", "tool-calling", "multi-agent-systems", "llm", "memory-systems", "reasoning-models"], external_resources: [{ title: "AI Agents Survey", url: "https://arxiv.org/abs/2401.03568" }], related_papers: [{ title: "AutoGPT: An Autonomous GPT-4 Experiment", authors: "Significant Gravitas", year: 2023 }], connections: 7, x: 10, y: 8, z: -5 },
      { id: "embeddings", label: "Embeddings", category: "Core Concept", cluster: 1, description: "Dense vector representations of text, images, or other data that capture semantic meaning in high-dimensional space.", related_concepts: ["rag", "vector-databases", "transformers", "llm"], external_resources: [{ title: "Sentence Transformers", url: "https://www.sbert.net/" }], related_papers: [{ title: "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks", authors: "Reimers & Gurevych", year: 2019 }], connections: 5, x: -15, y: 5, z: 8 },
      { id: "vector-databases", label: "Vector Databases", category: "Infrastructure", cluster: 1, description: "Databases optimized for storing and querying high-dimensional vectors using approximate nearest neighbor (ANN) search.", related_concepts: ["rag", "embeddings", "faiss", "qdrant", "chroma"], external_resources: [{ title: "Vector DB Comparison", url: "https://vectordb.io/" }], related_papers: [], connections: 4, x: -10, y: 12, z: 3 },
      { id: "faiss", label: "FAISS", category: "Tool", cluster: 1, description: "Facebook AI Similarity Search - A library for efficient similarity search and clustering of dense vectors by Meta.", related_concepts: ["rag", "embeddings", "vector-databases"], external_resources: [{ title: "FAISS GitHub", url: "https://github.com/facebookresearch/faiss" }], related_papers: [{ title: "Billion-scale similarity search with GPUs", authors: "Johnson et al.", year: 2019 }], connections: 3, x: -8, y: 15, z: 8 },

      { id: "chroma", label: "Chroma", category: "Tool", cluster: 1, description: "AI-native open-source embedding database designed for developers to build LLM apps with embeddings.", related_concepts: ["rag", "embeddings", "vector-databases"], external_resources: [{ title: "Chroma Docs", url: "https://docs.trychroma.com/" }], related_papers: [], connections: 2, x: -6, y: 10, z: -5 },
      { id: "langchain", label: "LangChain", category: "Framework", cluster: 2, description: "Popular Python/JS framework for building applications with LLMs through composable chains and agents.", related_concepts: ["agents", "rag", "llm", "prompt-engineering"], external_resources: [{ title: "LangChain Docs", url: "https://python.langchain.com/docs/" }], related_papers: [], connections: 4, x: 8, y: 5, z: -8 },

        <div class="info-section">
          <h4 style="font-size:0.875rem; font-weight:600; color:#cbd5e1; margin-bottom:8px; display:flex; align-items:center; gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
            Description
          </h4>
          <p style="font-size:0.875rem; color:#94a3b8; line-height:1.6">${node.description}</p>
        </div>

        <div class="info-section">
          <h4 style="font-size:0.875rem; font-weight:600; color:#cbd5e1; margin-bottom:12px; display:flex; align-items:center; gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            Related Concepts
          </h4>
          <div style="display:flex; flex-wrap:wrap; gap:6px">
            ${node.related_concepts.map(c => `<span class="tag">${c}</span>`).join('')}
          </div>
        </div>

        ${neighborDetails.length > 0 ? `
        <div class="info-section">
          <h4 style="font-size:0.875rem; font-weight:600; color:#cbd5e1; margin-bottom:12px; display:flex; align-items:center; gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Connected Nodes
          </h4>
          <div>
            ${neighborDetails.map(n => `
              <div class="neighbor-item" onclick="selectNode('${n.id}'); focusNodeCamera('${n.id}')" style="cursor:pointer">
                <div style="width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:#cbd5e1">${n.label.charAt(0)}</div>
                <div style="flex:1; min-width:0">
                  <div style="font-size:0.875rem; color:white; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${n.label}</div>
                  <div style="font-size:0.75rem; color:#64748b">${n.category}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        ${node.external_resources.length > 0 ? `
        <div class="info-section">
          <h4 style="font-size:0.875rem; font-weight:600; color:#cbd5e1; margin-bottom:12px; display:flex; align-items:center; gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            External Resources
          </h4>
          <div>
            ${node.external_resources.map((r, i) => `
              <a href="${r.url}" target="_blank" class="resource-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span>${r.title}</span>
              </a>
            `).join('')}
          </div>
        </div>
        ` : ''}

        ${node.related_papers.length > 0 ? `
        <div style="padding:16px 20px">
          <h4 style="font-size:0.875rem; font-weight:600; color:#cbd5e1; margin-bottom:12px; display:flex; align-items:center; gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            Related Papers
          </h4>
          <div>
            ${node.related_papers.map((p, i) => `
              <div class="paper-card">
                <div class="paper-title">${p.title}</div>
                <div class="paper-meta">${p.authors} • ${p.year}</div>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}
      `;
      panel.style.display = 'block';
    }

    // Search
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchClear = document.getElementById('search-clear');
    const searchIcon = document.getElementById('search-icon');

    searchInput.addEventListener('input', e => {
      const query = e.target.value.toLowerCase();
      if (query.length < 2) { searchResults.style.display = 'none'; searchClear.style.display = 'none'; searchIcon.style.display = 'block'; return; }
      searchClear.style.display = 'block'; searchIcon.style.display = 'none';
      const results = nodes.filter(n => n.label.toLowerCase().includes(query) || n.description.toLowerCase().includes(query));

      const clusterBadgeStyles = {
        1: 'background:rgba(59,130,246,0.2); color:#93c5fd',
        2: 'background:rgba(139,92,246,0.2); color:#c4b5fd',
        3: 'background:rgba(16,185,129,0.2); color:#6ee7b7',
        4: 'background:rgba(245,158,11,0.2); color:#fcd34d',
        5: 'background:rgba(239,68,68,0.2); color:#fca5a5',
        6: 'background:rgba(6,182,212,0.2); color:#67e8f9',
      };

      searchResults.innerHTML = results.map(r => `
        <button class="search-result" onclick="handleSearchSelect('${r.id}')">
          <div class="result-avatar">${r.label.charAt(0)}</div>
          <div style="flex:1; min-width:0">
            <div class="result-label">${r.label}</div>
            <div class="result-cat">${r.category}</div>
          </div>
          <span class="result-cluster" style="${clusterBadgeStyles[r.cluster] || 'background:rgba(148,163,184,0.2); color:#cbd5e1'}">${CLUSTER_NAMES[r.cluster]}</span>
        </button>
      `).join('');
      searchResults.style.display = results.length > 0 ? 'block' : 'none';
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchResults.style.display = 'none';
      searchClear.style.display = 'none';
      searchIcon.style.display = 'block';
    });

    function handleSearchSelect(id) {
      selectNode(id);
      focusNodeCamera(id);
      searchResults.style.display = 'none';
    }

    // Hide loading
    document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
